apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service
  namespace: payflow
data:
  EVENT_PUBLISHER: kafka
  KAFKA_BOOTSTRAP: redpanda:9092
  DB_POOL_SIZE: "10"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payflow
spec:
  # Two replicas: the outbox relay is safe to run on both thanks to FOR UPDATE SKIP LOCKED.
  replicas: 2
  selector:
    matchLabels: {app: payment-service}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: payment-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: payment-service
          image: ghcr.io/OWNER/payflow-payment-service:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: payment-service}
            - secretRef: {name: payflow-secrets}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payflow
spec:
  selector: {app: payment-service}
  ports: [{name: http, port: 80, targetPort: http}]
---
# k3s ships Traefik as its ingress controller. Cloudflare Tunnel points at this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow
  namespace: payflow
spec:
  rules:
    - host: api.payflow.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service: {name: payment-service, port: {name: http}}
