# Copy to secret.yaml (git-ignored), fill in real values, then:
#   kubectl apply -f deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: payflow-secrets
  namespace: payflow
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://postgres:5432/payflow
  DB_USER: payflow
  DB_PASSWORD: change-me
  # Admin API token (at least 32 characters; the service refuses to start otherwise).
  # Generate one with: openssl rand -base64 32
  ADMIN_TOKEN: change-me
