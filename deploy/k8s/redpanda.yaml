apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: payflow
spec:
  selector: {app: redpanda}
  ports: [{name: kafka, port: 9092}]
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: payflow
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: {app: redpanda}
  template:
    metadata:
      labels: {app: redpanda}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.3
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=redpanda-0.redpanda.payflow.svc.cluster.local:9092
          ports: [{containerPort: 9092}]
          readinessProbe:
            exec: {command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-topics
  namespace: payflow
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: redpandadata/redpanda:v26.2.3
          command: ["sh", "-c"]
          args:
            - rpk topic create payments.events -p 6 -X brokers=redpanda:9092 || rpk topic describe payments.events -X brokers=redpanda:9092
