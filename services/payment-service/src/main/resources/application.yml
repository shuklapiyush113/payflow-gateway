spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts: the limiter fails open, so a slow Redis must not slow every request down.
      timeout: 250ms
      connect-timeout: 250ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

payflow:
  rate-limit:
    # Per merchant: bursts of up to `capacity` requests, refilled at `refill-per-second`.
    capacity: 100
    refill-per-second: 50
  admin:
    # Bearer token for /admin/** (issuing and revoking API keys). Empty disables the admin API.
    token: ${ADMIN_TOKEN:}
  events:
    # log | kafka
    publisher: ${EVENT_PUBLISHER:log}
    topic: payments.events
  outbox:
    poll-interval: 1s
    batch-size: 100
    max-attempts: 10
  reconciliation:
    interval: 30s
    # Must exceed the bank call timeout, or an in-flight request could be marked failed.
    stale-after: 2m
    retry-after: 1m
    batch-size: 50
    alert-after-attempts: 10
  idempotency:
    lock-timeout: 60s
    retention: 24h
  ledger:
    fee-basis-points: 200
  risk:
    # 5,00,000.00 in minor units
    block-above-minor: 50000000
