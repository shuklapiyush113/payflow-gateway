# Local stack:  docker compose up -d --build
# API on http://localhost:8080, Redpanda console on http://localhost:8081
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      retries: 10

  # Kafka-compatible broker; a single binary, light enough for a free VM.
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda start --mode dev-container --smp 1 --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  redpanda-init:
    image: redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda: {condition: service_healthy}
    # Succeeds when the topic already exists, so `up` can be run again.
    entrypoint: ["/bin/sh", "-c", "rpk topic create payments.events -p 6 -X brokers=redpanda:9092; rpk topic describe payments.events -X brokers=redpanda:9092 > /dev/null"]
    restart: "no"

  console:
    image: redpandadata/console:v3.11.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8081:8080"]
    depends_on:
      redpanda: {condition: service_healthy}

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payflow
      EVENT_PUBLISHER: kafka
      KAFKA_BOOTSTRAP: redpanda:9092
      # Local-only admin token for /admin/** (onboarding merchants). Real deployments use the k8s Secret.
      ADMIN_TOKEN: local-dev-admin-token-0123456789abcdef
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda-init: {condition: service_completed_successfully}

volumes:
  pgdata:
